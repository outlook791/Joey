[package]
name = "joey-gtk"
description = "Joey's pocket-shaped selector: select files, press a key, pick a format."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "joey-gtk"
path = "src/main.rs"

[dependencies]
joey-core = { path = "../joey-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
