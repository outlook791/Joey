# Flatpak manifest for Joey.
#
# Build and install locally (Fedora: sudo dnf install flatpak-builder):
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#     --install build-dir flatpak/io.github.outlook791.Joey.yml
#   flatpak run io.github.outlook791.Joey
#
# Regenerate cargo-sources.json after changing dependencies:
#   python3 flatpak-cargo-generator.py Cargo.lock -o flatpak/cargo-sources.json
#
# Inside: FFmpeg, ImageMagick (HEIC, AVIF), Ghostscript, qpdf, libarchive,
# Pandoc and Typst (Word, ODT, RTF, Markdown, HTML, EPUB, and those to
# PDF), openpyxl (Excel <-> CSV, PDF tables to Excel). LibreOffice is far
# too big to bundle: Joey uses the one on the computer, if any, for the
# best Office conversions, PowerPoint included.

id: io.github.outlook791.Joey
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: joey-gtk

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Converted files are saved next to the originals, wherever they are,
  # and the right-click entry and Alt+C are written into the file
  # managers' settings in the home folder. Without this, every conversion
  # would need a "save as" dialog: an extra step Joey exists to avoid.
  - --filesystem=home
  # Programs Joey hands files to, outside the sandbox: LibreOffice for
  # Office documents (too big to bundle), KDE Connect and LocalSend to send
  # files to phones, a terminal for "Open a terminal here". Started with
  # flatpak-spawn --host, only when the person picks one of these.
  - --talk-name=org.freedesktop.Flatpak
  # GSConnect, KDE Connect for GNOME: send files to paired phones.
  - --talk-name=org.gnome.Shell.Extensions.GSConnect

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # ---- Video and audio: FFmpeg with H.264 ----
  - name: x264
    config-opts:
      - --enable-shared
      - --enable-pic
      - --disable-cli
    sources:
      - type: git
        url: https://github.com/mirror/x264.git
        commit: 31e19f92f00c7003fa115047ce50978bc98c3a0d

  - name: ffmpeg
    config-opts:
      - --enable-gpl
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-ffplay
      - --disable-ffprobe
      - --enable-libx264
      - --enable-libvpx
      - --enable-libopus
      - --enable-libvorbis
      - --enable-libmp3lame
      - --enable-libdav1d
    cleanup:
      - /share/ffmpeg
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n8.0.3
        commit: 8ae0b34901ba60a802f183ee75a250a9fc3e09a5

  # ---- Images: ImageMagick with HEIC/AVIF reading and SVG ----
  - name: libde265
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_SDL=OFF
      - -DENABLE_ENCODER=OFF
    sources:
      - type: git
        url: https://github.com/strukturag/libde265.git
        tag: v1.1.3
        commit: ba62bf4cfb3242f3bf0a45617ff09e35236e4d82

  - name: libheif
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_LIBDE265=ON
      - -DWITH_DAV1D=ON
      - -DWITH_X265=OFF
      - -DWITH_AOM_ENCODER=OFF
      - -DWITH_AOM_DECODER=OFF
      - -DWITH_EXAMPLES=OFF
      - -DWITH_GDK_PIXBUF=OFF
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/strukturag/libheif.git
        tag: v1.23.6
        commit: f81f28ac014b1c28dee483ac45b72c6b05bc421a

  - name: imagemagick
    config-opts:
      - --disable-docs
      - --disable-static
      - --with-heic=yes
      - --with-rsvg=yes
      - --with-webp=yes
      - --without-x
      - --without-perl
      - --without-magick-plus-plus
      - --without-gslib
    sources:
      - type: git
        url: https://github.com/ImageMagick/ImageMagick.git
        tag: 7.1.2-34
        commit: a0c4bf729a26a5c2feb28b0365b47a8db736078a

  # ---- PDF: pages to images, compression, merging ----
  - name: ghostscript
    buildsystem: simple
    build-commands:
      - ./autogen.sh --prefix=/app --disable-cups --disable-gtk --without-x --without-tesseract --without-libpaper --disable-compile-inits
      - make -j${FLATPAK_BUILDER_N_JOBS} so gs
      - make install
    sources:
      - type: git
        url: https://github.com/ArtifexSoftware/ghostpdl.git
        tag: ghostpdl-10.08.0
        commit: 05631c2cba4e578fdd6bd25cae6f0939436de848

  - name: qpdf
    # qpdf refuses to configure in its source folder, and flatpak-builder's
    # cmake-ninja ended up doing just that: build in "build/" by hand.
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_INSTALL_LIBDIR=lib
        -DCMAKE_BUILD_TYPE=Release -DREQUIRE_CRYPTO_NATIVE=ON -DUSE_IMPLICIT_CRYPTO=OFF
        -DBUILD_DOC=OFF -DBUILD_STATIC_LIBS=OFF -DBUILD_TESTING=OFF
      - cmake --build build
      - cmake --install build
    sources:
      - type: git
        url: https://github.com/qpdf/qpdf.git
        tag: v12.4.2
        commit: 4eba95899886e851cc41d76886483b347612f2a8

  # ---- Archives: ZIP, TAR, 7Z, RAR (read) ----
  - name: libarchive
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_TEST=OFF
      - -DENABLE_CPIO=OFF
      - -DENABLE_CAT=OFF
      - -DENABLE_UNZIP=OFF
    sources:
      - type: git
        url: https://github.com/libarchive/libarchive.git
        tag: v3.8.9
        commit: 27cbc7827172698143e440801fc0ba39ccb4f1f5

  # ---- Joey itself ----
  # ---- Documents: Pandoc and Typst (upstream release builds) ----
  - name: pandoc
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/pandoc /app/bin/pandoc
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-linux-amd64.tar.gz
        sha256: d0c90410e90204c9ca83b8539fac5c7aed01fd537207e4585849f8abc5df20b8
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-linux-arm64.tar.gz
        sha256: 445d96fd08801fe636cab1158b4f017ee320ac3b7446328b4fe2f902117b19b9

  - name: typst
    buildsystem: simple
    build-commands:
      - install -Dm755 typst /app/bin/typst
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
        sha256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/typst/typst/releases/download/v0.15.1/typst-aarch64-unknown-linux-musl.tar.xz
        sha256: 5aa8d74a3d906e60ea12a66ac2f37f8eef1b14cbad7182a745e393a10c23dcee

  # ---- Spreadsheets: openpyxl (Excel <-> CSV, PDF tables to Excel) ----
  - name: python-openpyxl
    buildsystem: simple
    build-commands:
      - pip3 install --exec-prefix=/app --prefix=/app --no-deps --no-index
        --find-links=. --no-build-isolation et_xmlfile openpyxl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/c1/8b/5fe2cc11fee489817272089c4203e679c63b570a5aaeb18d852ae3cbba6a/et_xmlfile-2.0.0-py3-none-any.whl
        sha256: 7a91720bc756843502c3b7504c77b8fe44217c85c537d85037f0f536151b2caa
      - type: file
        url: https://files.pythonhosted.org/packages/c0/da/977ded879c29cbd04de313843e76868e6e13408a94ed6b987245dc7c8506/openpyxl-3.1.5-py2.py3-none-any.whl
        sha256: 5282c12b107bffeef825f4617dc029afaf41d0ea60823bbb665ef3079dc79de2

  - name: joey
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/joey/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release -p joey-gtk -p joey-cli
      - install -Dm755 target/release/joey-gtk /app/bin/joey-gtk
      - install -Dm755 target/release/joey /app/bin/joey
      - install -Dm644 data/io.github.outlook791.Joey.desktop /app/share/applications/io.github.outlook791.Joey.desktop
      - install -Dm644 data/io.github.outlook791.Joey.metainfo.xml /app/share/metainfo/io.github.outlook791.Joey.metainfo.xml
      - install -Dm644 data/io.github.outlook791.Joey.svg /app/share/icons/hicolor/scalable/apps/io.github.outlook791.Joey.svg
      - for d in data/icons/*/; do install -Dm644 "$d/io.github.outlook791.Joey.png" "/app/share/icons/hicolor/$(basename "$d")/apps/io.github.outlook791.Joey.png"; done
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - .flatpak-builder
      - cargo-sources.json
