# Automatic checks, on every change: builds Joey and runs the tests, the
# command line, the AI server, the window and install.sh on five
# distributions, checks the code style and the store metadata, and
# builds the Flatpak. Free for public repositories.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer change makes older checks of the same branch pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Fedora, distro: fedora, image: "fedora:latest" }
          - { name: Ubuntu 24.04 LTS, distro: ubuntu, image: "ubuntu:24.04" }
          - { name: Debian 13, distro: debian, image: "debian:trixie" }
          - { name: Arch Linux, distro: arch, image: "archlinux:latest" }
          - { name: openSUSE Tumbleweed, distro: opensuse, image: "opensuse/tumbleweed:latest" }
    container: ${{ matrix.image }}
    steps:
      - name: Git (needed to fetch the code)
        run: |
          case ${{ matrix.distro }} in
            fedora) dnf -y -q install git ;;
            ubuntu|debian) apt-get update -qq && apt-get install -y -qq git ca-certificates ;;
            arch) pacman -Sy --noconfirm --needed git ;;
            opensuse) zypper -n -q in git tar gzip ;;
          esac
      - uses: actions/checkout@v5
      - name: Install what Joey needs
        run: 'ci/run.sh "${{ matrix.name }} - install" ci/deps.sh ${{ matrix.distro }}'
      - name: Build, test and try everything
        run: 'ci/run.sh "${{ matrix.name }} - checks" ci/check.sh'

  style:
    name: Code style and store metadata
    runs-on: ubuntu-latest
    container: "fedora:latest"
    steps:
      - run: dnf -y -q install git
      - uses: actions/checkout@v5
      - run: ci/deps.sh fedora
      - run: dnf -y -q install rustfmt clippy
      - name: Formatting
        run: ci/run.sh Formatting cargo fmt --all --check
      - name: Lints
        run: ci/run.sh Lints cargo clippy --locked --all-targets -- -D warnings
      - name: Menu entry
        run: ci/run.sh "Menu entry" desktop-file-validate data/io.github.outlook791.Joey.desktop
      - name: Store metadata
        run: ci/run.sh "Store metadata" appstreamcli validate --no-net --explain data/io.github.outlook791.Joey.metainfo.xml

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      published: ${{ steps.publish.outputs.done }}
    env:
      # Publishing needs the signing key, kept as a repository secret.
      HAS_KEY: ${{ secrets.FLATPAK_GPG_KEY != '' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Reuse what earlier builds compiled (FFmpeg, ImageMagick…)
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-${{ hashFiles('flatpak/**') }}-${{ github.sha }}
          restore-keys: flatpak-${{ hashFiles('flatpak/**') }}-
      - name: Flathub, where the runtime comes from
        run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: >
          ci/run.sh "Flatpak build"
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse
          --force-clean --repo=repo build-dir flatpak/io.github.outlook791.Joey.yml
      - name: Make the installable file
        run: flatpak build-bundle repo joey.flatpak io.github.outlook791.Joey --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: joey-flatpak
          path: joey.flatpak
          retention-days: 30
      - name: Try it
        run: |
          # Containers have no machine id, which D-Bus needs.
          [ -s /etc/machine-id ] || dbus-uuidgen > /etc/machine-id
          # Install the file as a person would, then use it.
          ci/run.sh "Flatpak install" flatpak install --user -y --noninteractive joey.flatpak
          ci/run.sh "Flatpak engines" flatpak run --command=joey io.github.outlook791.Joey --engines
          # A folder this account owns (the CI's home belongs to another
          # user), opened to the sandbox as the home folder is for people.
          dir=/srv/joey-test
          mkdir -p "$dir"
          for f in photo.jpg two-pages.pdf note.docx readme.md invoice.pdf table.csv; do
            cp "crates/joey-core/tests/fixtures/$f" "$dir/"
          done
          run="flatpak run --filesystem=$dir --command=joey io.github.outlook791.Joey"
          ci/run.sh "Flatpak convert" $run "$dir/photo.jpg" --to webp
          ci/run.sh "Flatpak PDF pages" $run "$dir/two-pages.pdf" --to png
          ci/run.sh "Flatpak Word to PDF" $run "$dir/note.docx" --to pdf
          ci/run.sh "Flatpak Markdown to EPUB" $run "$dir/readme.md" --to epub
          ci/run.sh "Flatpak PDF to Excel" $run "$dir/invoice.pdf" --to xlsx
          ci/run.sh "Flatpak PDF to text" $run "$dir/invoice.pdf" --to txt
          ci/run.sh "Flatpak CSV to Excel" $run "$dir/table.csv" --to xlsx
          ci/run.sh "Flatpak Excel to PDF" $run "$dir/table.xlsx" --to pdf
          ls -l "$dir"
          for f in photo.webp two-pages-1.png note.pdf readme.epub invoice.xlsx invoice.txt table.xlsx table.pdf; do
            test -s "$dir/$f" || { echo "::error title=Flatpak::$f missing"; exit 1; }
          done
      - name: Joey Office (LibreOffice add-on)
        run: |
          # The official LibreOffice build, checked against its published checksum.
          base=https://download.documentfoundation.org/libreoffice/stable
          v=$(curl -sSL "$base/" | grep -o 'href="[0-9][0-9.]*/"' | sed 's/href="//; s#/"##' | sort -V | tail -1)
          f="LibreOffice_${v}_Linux_x86-64_deb.tar.gz"
          echo "LibreOffice $v"
          curl -sSL -o flatpak/LibreOffice.tar.gz "$base/$v/deb/x86_64/$f"
          want=$(curl -sSL "$base/$v/deb/x86_64/$f.sha256" | grep -o '^[0-9a-f]\{64\}')
          echo "$want  flatpak/LibreOffice.tar.gz" | sha256sum -c
          ci/run.sh "Joey Office build" flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo build-office flatpak/io.github.outlook791.Joey.Office.yml
          flatpak build-bundle --runtime repo joey-office.flatpak io.github.outlook791.Joey.Office master
          ci/run.sh "Joey Office install" flatpak install --user -y --noninteractive joey-office.flatpak
          dir=/srv/joey-test
          cp crates/joey-core/tests/fixtures/slides.pptx "$dir/"
          run="flatpak run --filesystem=$dir --command=joey io.github.outlook791.Joey"
          ci/run.sh "Joey Office engines" $run --engines
          ci/run.sh "Joey Office PowerPoint to PDF" $run "$dir/slides.pptx" --to pdf
          test -s "$dir/slides.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: joey-office-flatpak
          path: joey-office.flatpak
          retention-days: 30
      - name: Sign the repository and make the install site
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          ci/run.sh "Publish" ci/publish.sh
          echo "done=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.done == 'true'
        with:
          path: site

  pages:
    name: Publish on GitHub Pages
    needs: flatpak
    if: needs.flatpak.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
